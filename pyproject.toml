[project]
name = "hybrid-search"
version = "0.1.0"
description = "Hybrid lexical + vector search engine built from scratch: BM25 inverted index, HNSW, RRF, WAL and segments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.scripts]
hybrid-search = "hybridsearch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybridsearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower statistical tests (HNSW recall)"]

[tool.coverage.run]
source = ["hybridsearch"]
branch = true

[tool.coverage.report]
show_missing = true
