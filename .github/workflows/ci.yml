name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python 3.12 --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage
        run: uv run pytest --cov --cov-fail-under=90
      - name: Build wheel
        run: uv build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hybrid-search:ci .
      - name: Smoke test
        run: |
          docker run -d --name hs -p 8000:8000 hybrid-search:ci
          for _ in $(seq 1 30); do
            if curl -fs localhost:8000/healthz; then break; fi
            sleep 1
          done
          curl -fs -X POST localhost:8000/documents -H 'content-type: application/json' \
            -d '{"documents":[{"id":"a","fields":{"title":"Espresso","body":"pressure"}}]}'
          curl -fs -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"query":"espresso"}' | grep -q '"id": *"a"'
          docker rm -f hs
